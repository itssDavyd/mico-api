name: api-mico

services:
  redis:
    image: redis:7-alpine
    container_name: api-mico-redis
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    profiles: ["dev"]
    image: ollama/ollama
    container_name: api-mico-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: api-mico-backend
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - audio_data:/app/audio
      - pdf_data:/app/pdfs
    restart: unless-stopped

  worker:
    build: ./backend
    container_name: api-mico-worker
    command: ["uv", "run", "arq", "workers.settings.WorkerSettings"]
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - audio_data:/app/audio
      - pdf_data:/app/pdfs
    restart: unless-stopped

volumes:
  redis_data:
    name: api-mico-redis-data
  ollama_data:
    name: api-mico-ollama-data
  audio_data:
    name: api-mico-audio-data
  pdf_data:
    name: api-mico-pdf-data
